audience_prompt: |
  시청자는 13세 이상 10대와 일반 시청자입니다.
  - 첫 문장(첫 2초)은 스크롤을 멈추게 하는 강한 훅이어야 합니다. 예: "이거 알면 상위 1%입니다."
  - 빠르고 리듬감 있는 말투, 짧은 문장, 가벼운 유머와 밈 감성은 OK.
  - 단, 사실은 반드시 정확해야 합니다. 과장·낚시·허위 정보는 금지입니다(유튜브 수익화 정책 위반).
  - 마지막 장면은 반전이나 여운으로 끝내고, 다음 영상이 궁금하게 만드세요.
  - 아동을 대상으로 하는 표현, 캐릭터, 말투는 쓰지 않습니다(이 채널은 아동용이 아님).
