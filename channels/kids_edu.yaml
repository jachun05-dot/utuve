# 키즈 교육 채널 (3~7세)
name: 키즈 교육
made_for_kids: true          # 반드시 true 유지 (COPPA)
category_id: "27"            # Education
privacy: private             # 업로드 후 직접 확인하고 공개로 바꾸세요
voice: ko-KR-SunHiNeural
rate: "-8%"                  # 아이들용으로 조금 천천히
pitch: "+4Hz"
target_seconds: 40
scene_count: 7
words_per_caption: 2
caption_pop: false
font: NanumSquareRound
font_size: 92
caption_color: "&H00FFFFFF"
caption_outline: "&H00402060"
headline_color: [255, 255, 255]
background_colors:           # 스톡 영상이 없을 때 쓰는 파스텔 배경
  - [[255, 183, 197], [255, 223, 186]]
  - [[186, 225, 255], [186, 255, 201]]
  - [[255, 255, 186], [255, 210, 160]]
  - [[220, 198, 255], [186, 225, 255]]
music_volume: 0.10
default_tags: [키즈, 유아교육, 어린이, 동물, 배워요]
topic_pool: >
  동물(생김새, 소리, 사는 곳), 숫자 세기, 색깔, 모양, 날씨, 탈것, 과일과 채소,
  쉬운 영어 단어, 몸의 부분, 좋은 생활습관(양치, 손 씻기)
audience_prompt: |
  시청자는 3~7세 아이와 부모입니다. 유튜브 아동용 콘텐츠 품질 기준을 지키세요.
  - 영상마다 아이가 배울 것 하나를 분명히 정하고, 끝에 한 번 더 복습시킵니다.
  - 쉬운 단어, 짧은 문장, 다정하고 차분한 말투. 아이에게 질문을 던지고 잠깐 생각할 틈을 줍니다.
  - 무섭거나, 폭력적이거나, 위험한 행동을 따라 하게 하거나, 자극적인 내용은 절대 넣지 않습니다.
  - 사실이 틀리면 안 됩니다. 확실하지 않은 정보는 쓰지 않습니다.
  - 구독, 좋아요, 상품 구매를 아이에게 요구하지 않습니다.


# ── 생성형 AI 배경 ── (실패하면 Pexels 스톡 -> 단색 배경 순서로 대체)
ai_backend: comfyui           # comfyui(무료, 내 그래픽카드) | fal(유료 API) | none
comfy_url: http://127.0.0.1:8188
comfy_workflow: workflows/sdxl_image.json   # AI 그림 + 카메라 움직임 (2070 Super 기준 장면당 약 20~40초)
#   다른 선택지: workflows/sdxl_image.json (이미지, 빠름) / workflows/wan21_t2v_1.3b.json (영상, 느림)
ai_video_scenes: all            # all 또는 숫자(앞에서 몇 장면만 AI로)
ai_model: fal-ai/kling-video/v3/turbo/standard/text-to-video   # ai_backend: fal 일 때만 사용
ai_duration: "5"
ai_style: >
  cute 3D animated cartoon style, soft pastel colors, bright friendly lighting,
  big expressive eyes, gentle and calm, safe for young children, no text, no logos
